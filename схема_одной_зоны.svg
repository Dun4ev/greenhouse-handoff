<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1290" width="1700" height="1290" role="img" aria-labelledby="title desc">
<title id="title">Предварительная функциональная схема полива одной зоны теплиц</title>
<desc id="desc">Три емкости с удобрениями через клапаны и насос Н1 подают раствор в емкость Е4. Насос Н2 направляет раствор через датчик потока FS1 к поливным клапанам. После FS1 выделена линия отбора пробы с фильтром, краном, измерительной ячейкой HM-100 и свободным сливом в Е4. Отдельно показаны связи шкафов управления и силового питания.</desc>
<defs>
  <marker id="mainArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#175d75"/></marker>
  <marker id="sampleArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2b806f"/></marker>
  <marker id="returnArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a55c21"/></marker>
  <marker id="signalArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#694e85"/></marker>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#183332} .bg{fill:#f5f8f5} .panel{fill:#fff;stroke:#cfdfd8;stroke-width:2}.label{font-size:19px;fill:#446159}.heading{font-size:28px;font-weight:700}.title{font-size:33px;font-weight:750}.subtitle{font-size:20px;fill:#39564d}.tag{font-size:23px;font-weight:750}.caption{font-size:16px;fill:#405e57}.small{font-size:15px;fill:#405e57}.main{fill:none;stroke:#175d75;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.samp{fill:none;stroke:#2b806f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ret{fill:none;stroke:#a55c21;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 6}.signal{fill:none;stroke:#694e85;stroke-width:3;stroke-dasharray:8 6}.note{fill:#fff3dd;stroke:#dcae66;stroke-width:2}.tank{fill:#e7f3ef;stroke:#598779;stroke-width:2}.item{fill:#eaf4f6;stroke:#6293a1;stroke-width:2}.probe{fill:#e9f5ef;stroke:#73a89a;stroke-width:2}.control{fill:#f1eef8;stroke:#a399be;stroke-width:2}.pill{font-size:15px;font-weight:700;fill:#305d50;letter-spacing:.08em}.alert{font-size:16px;fill:#72480e;font-weight:650}
  </style>
</defs>
<rect class="bg" width="1700" height="1290" rx="18"/>
<text class="pill" x="46" y="47">ПРЕДВАРИТЕЛЬНАЯ СХЕМА · ОДНА ТИПОВАЯ ЗОНА</text>
<text class="title" x="46" y="92">Технология полива и связи шкафов</text>
<text class="subtitle" x="46" y="126">Функциональная компоновка для обсуждения. Стрелки показывают направление потока.</text>
<rect x="40" y="151" width="1620" height="700" rx="14" class="panel"/>
<text class="heading" x="65" y="189">1. Линии раствора</text>
<text class="caption" x="65" y="217">Е1–Е3 → выбор подачи → Н1 → Е4 → Н2 → FS1 → поливные участки</text>
<!-- Three supply tanks, their actuators and common suction header -->
<g>
 <rect class="tank" x="72" y="259" width="145" height="69" rx="11"/><text class="tag" x="91" y="288">Е1</text><text class="caption" x="91" y="313">удобрение</text>
 <rect class="tank" x="72" y="352" width="145" height="69" rx="11"/><text class="tag" x="91" y="381">Е2</text><text class="caption" x="91" y="406">удобрение</text>
 <rect class="tank" x="72" y="445" width="145" height="69" rx="11"/><text class="tag" x="91" y="474">Е3</text><text class="caption" x="91" y="499">удобрение</text>
 <path class="main" d="M217 293 H272" marker-end="url(#mainArrow)"/><path class="main" d="M217 386 H272" marker-end="url(#mainArrow)"/><path class="main" d="M217 479 H272" marker-end="url(#mainArrow)"/>
 <rect class="item" x="272" y="267" width="106" height="52" rx="8"/><text class="tag" x="302" y="300">К1</text>
 <rect class="item" x="272" y="360" width="106" height="52" rx="8"/><text class="tag" x="302" y="393">К2</text>
 <rect class="item" x="272" y="453" width="106" height="52" rx="8"/><text class="tag" x="302" y="486">К3</text>
 <path class="main" d="M378 293 H447" marker-end="url(#mainArrow)"/><path class="main" d="M378 386 H447" marker-end="url(#mainArrow)"/><path class="main" d="M378 479 H447" marker-end="url(#mainArrow)"/>
 <path class="main" d="M447 293 V479"/><path class="main" d="M447 308 V358" marker-end="url(#mainArrow)"/><path class="main" d="M447 466 V416" marker-end="url(#mainArrow)"/><circle cx="447" cy="293" r="5" fill="#175d75"/><circle cx="447" cy="386" r="5" fill="#175d75"/><circle cx="447" cy="479" r="5" fill="#175d75"/>
 <path class="main" d="M447 386 H501" marker-end="url(#mainArrow)"/>
 <text class="caption" x="259" y="547">Приводы выбора подачи</text><text class="small" x="259" y="569">проводка и управление уточняются</text>
</g>
<!-- Main line pump, tank, pump, switch -->
<rect class="item" x="501" y="350" width="132" height="72" rx="10"/><text class="tag" x="546" y="379">Н1</text><text class="small" x="520" y="404">перекачка</text>
<path class="main" d="M633 386 H702" marker-end="url(#mainArrow)"/>
<rect class="tank" x="702" y="325" width="158" height="123" rx="18"/><path d="M702 357 Q781 376 860 357" fill="none" stroke="#8fb5aa" stroke-width="2"/><text class="tag" x="754" y="394">Е4</text><text class="small" x="719" y="418">рабочий раствор</text><text class="small" x="731" y="440">без мешалки</text>
<path class="main" d="M860 386 H932" marker-end="url(#mainArrow)"/>
<rect class="item" x="932" y="350" width="132" height="72" rx="10"/><text class="tag" x="977" y="379">Н2</text><text class="small" x="959" y="404">полив</text>
<path class="main" d="M1064 386 H1121" marker-end="url(#mainArrow)"/>
<rect class="item" x="1121" y="350" width="121" height="72" rx="10"/><text class="tag" x="1155" y="379">FS1</text><text class="small" x="1137" y="404">есть поток</text>
<path class="main" d="M1242 386 H1385" marker-end="url(#mainArrow)"/><circle cx="1302" cy="386" r="6" fill="#175d75"/>
<text class="small" x="1114" y="455">FS1 не измеряет расход</text>
<!-- Simplified branch manifold -->
<path class="main" d="M1385 282 V490"/>
<path class="main" d="M1385 293 H1434" marker-end="url(#mainArrow)"/><path class="main" d="M1385 355 H1434" marker-end="url(#mainArrow)"/><path class="main" d="M1385 417 H1434" marker-end="url(#mainArrow)"/>
<rect class="item" x="1434" y="271" width="93" height="43" rx="7"/><text class="tag" x="1455" y="300">К4</text><path class="main" d="M1527 293 H1577" marker-end="url(#mainArrow)"/>
<rect class="item" x="1434" y="333" width="93" height="43" rx="7"/><text class="tag" x="1455" y="362">К5</text><path class="main" d="M1527 355 H1577" marker-end="url(#mainArrow)"/>
<rect class="item" x="1434" y="395" width="93" height="43" rx="7"/><text class="tag" x="1455" y="424">К6</text><path class="main" d="M1527 417 H1577" marker-end="url(#mainArrow)"/>
<path d="M1385 477 H1434" fill="none" stroke="#175d75" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#mainArrow)"/><rect x="1434" y="454" width="161" height="48" rx="7" fill="#fff" stroke="#6293a1" stroke-width="2" stroke-dasharray="7 5"/><text class="small" x="1445" y="474">К7–К9 только</text><text class="small" x="1445" y="492">для зоны 2</text>
<text class="caption" x="1410" y="540">к поливным участкам</text><text class="small" x="1410" y="562">работают по очереди</text>
<!-- Probe line after FS1 toward atmospheric cell -->
<text class="heading" x="65" y="621">2. Отбор и местное измерение</text><text class="caption" x="65" y="649">Проба отбирается после FS1; после измерения возвращается в свою Е4 свободным сливом.</text>
<path class="samp" d="M1302 386 V692 H1254" marker-end="url(#sampleArrow)"/>
<rect class="probe" x="1139" y="657" width="115" height="70" rx="9"/><text class="tag" x="1150" y="686">Фильтр</text><text class="small" x="1150" y="710">пробы</text>
<path class="samp" d="M1139 692 H1120" marker-end="url(#sampleArrow)"/>
<rect class="probe" x="970" y="657" width="150" height="70" rx="9"/><text class="tag" x="992" y="686">Кран</text><text class="small" x="985" y="710">игольчатый</text>
<path class="samp" d="M970 692 H950" marker-end="url(#sampleArrow)"/>
<rect class="probe" x="820" y="645" width="130" height="94" rx="9"/><text class="small" x="835" y="674">Воздушный</text><text class="small" x="850" y="697">разрыв</text><text class="small" x="833" y="721">открытый слив</text>
<path class="samp" d="M820 692 H800" marker-end="url(#sampleArrow)"/>
<rect class="probe" x="570" y="645" width="230" height="94" rx="9"/><text class="tag" x="628" y="675">HM-100</text><text class="small" x="597" y="699">безнапорная ячейка</text><text class="small" x="622" y="722">pH · EC · T</text>
<path class="ret" d="M570 692 H550 V486 H764 V448" marker-end="url(#returnArrow)"/>
<text class="small" x="570" y="771">Условно показан свободный перелив в Е4, не в напорную линию.</text><text class="small" x="570" y="792">Реальную высоту, трассу и уклон нужно определить на объекте.</text>
<rect class="note" x="70" y="696" width="477" height="99" rx="9"/><text class="alert" x="88" y="723">Не монтажный чертеж</text><text class="small" x="88" y="747">DN, арматура, крепления, отметки, трассы</text><text class="small" x="88" y="770">и фактические места оборудования не утверждены.</text>
<!-- Controls -->
<rect x="40" y="874" width="1620" height="311" rx="14" class="panel"/>
<text class="heading" x="65" y="915">3. Управление и силовое питание</text><text class="caption" x="65" y="942">На каждую зону предусмотрены два отдельных шкафа. Ниже показана логика связи, не электрическая схема.</text>
<rect class="control" x="77" y="980" width="351" height="151" rx="10"/><text class="tag" x="98" y="1014">ША-У · автоматика</text><text class="label" x="98" y="1043">Raspberry Pi 5 + 2 × МК210-301</text><text class="small" x="98" y="1070">Принимает FS1 и обратные сигналы,</text><text class="small" x="98" y="1093">формирует команды через реле.</text>
<path class="signal" d="M429 1010 H609" marker-end="url(#signalArrow)"/><text class="small" x="452" y="998">команды: сухие контакты</text>
<path class="signal" d="M609 1095 H429" marker-end="url(#signalArrow)"/><text class="small" x="462" y="1120">отдельные обратные сигналы</text>
<rect class="control" x="625" y="980" width="324" height="151" rx="10"/><text class="tag" x="647" y="1014">ЩС · силовой шкаф</text><text class="label" x="647" y="1044">Питание и защита нагрузок</text><text class="small" x="647" y="1070">Насосы Н1, Н2 и клапаны полива;</text><text class="small" x="647" y="1093">катушки полива: 24 В AC.</text>
<rect class="note" x="985" y="980" width="630" height="151" rx="10"/><text class="alert" x="1005" y="1009">Интерфейс и безопасность требуют согласования</text><text class="small" x="1005" y="1035">Клеммы, защиты и подключение приводов К1–К3 не утверждены.</text><text class="small" x="1005" y="1058">Сигнал контактора не подтверждает вращение двигателя или поток.</text><text class="small" x="1005" y="1081">До решения безопасного теплого перезапуска модулей ОВЕН</text><text class="small" x="1005" y="1104">исполнительные механизмы не подключать.</text>
<path class="main" d="M74 1224 H130" marker-end="url(#mainArrow)"/><text class="small" x="144" y="1230">основная линия</text><path class="samp" d="M365 1224 H421" marker-end="url(#sampleArrow)"/><text class="small" x="435" y="1230">линия пробы</text><path class="ret" d="M631 1224 H687" marker-end="url(#returnArrow)"/><text class="small" x="701" y="1230">свободный слив</text><path class="signal" d="M923 1224 H979" marker-end="url(#signalArrow)"/><text class="small" x="993" y="1230">сигналы управления</text><text class="small" x="1303" y="1230">Не в масштабе · для согласования</text>
</svg>
